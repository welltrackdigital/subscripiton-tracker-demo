:root{
  --mid:#0B1424;--violet:#1E3A66;--lav:#7DD3C8;--pale:#CFE3F2;
  --bg:#F2F6FB;--bg2:#E3ECF6;--panel:#FFFFFF;--card:#FFFFFF;--card2:#F7FAFD;--card3:#DCE7F3;
  --line:rgba(11,20,36,.12);--line2:rgba(11,20,36,.07);
  --ink:#0B1424;--ink2:#18243A;--muted:#56677D;--faint:#5B7BA6;
  --accent:#1E3A66;--accent2:#152A4C;--btn:#1E3A66;--btn2:#182C4F;--onbtn:#fff;
  --good:#0F8A6B;--warn:#A86400;--bad:#C23A51;--coral:#E8603F;--teal:#0E9F8E;
  --shadow:0 18px 40px rgba(11,20,36,.12);--shadow2:0 4px 14px rgba(11,20,36,.06);
  --glow:0 0 0 1px rgba(30,58,102,.25),0 10px 26px rgba(30,58,102,.18);
  --r:18px;--r2:13px;--r3:10px;
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#080F1C;--bg2:#0B1424;--panel:#111B2D;--card:#141F33;--card2:#1A2740;--card3:#1E3A66;
  --line:rgba(125,211,200,.18);--line2:rgba(125,211,200,.1);
  --ink:#EAF2FA;--ink2:#CFE3F2;--muted:#A3B8CF;--faint:#5B7BA6;
  --accent:#7DD3C8;--accent2:#D7E6F4;--btn:#2F6FAE;--btn2:#5B7BA6;--onbtn:#fff;
  --good:#4CC38A;--warn:#E9B24C;--bad:#F07C8C;--coral:#FF8A6B;--teal:#2DD4BF;
  --shadow:0 18px 44px rgba(0,0,0,.45);--shadow2:0 6px 18px rgba(0,0,0,.3);
  --glow:0 0 0 1px rgba(125,211,200,.35),0 10px 30px rgba(30,58,102,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 90% 0%,rgba(125,211,200,.28),transparent 60%),radial-gradient(700px 500px at -10% 100%,rgba(207,227,242,.9),transparent 60%)}
html[data-theme="dark"] body::before{background:radial-gradient(900px 600px at 90% 0%,rgba(30,58,102,.35),transparent 60%),radial-gradient(700px 500px at -10% 100%,rgba(30,58,102,.25),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:rgba(125,211,200,.5)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--card3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}

/* ================= sidebar (midnight, starlight) ================= */
.app{position:relative;z-index:1;min-height:100vh;display:flex}
.side{width:284px;flex:0 0 284px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40;color:#CFE3F2;
  background:radial-gradient(rgba(207,227,242,.15) 1px,transparent 1.4px) 0 0/22px 22px,radial-gradient(rgba(207,227,242,.07) 1px,transparent 1.2px) 11px 11px/22px 22px,linear-gradient(180deg,#0B1424 0%,#13213A 60%,#1E3A66 100%);box-shadow:8px 0 30px rgba(11,20,36,.18)}
.brand{display:flex;align-items:center;gap:11px;color:inherit;text-align:left;padding:18px 18px 14px;border-bottom:1px solid rgba(207,227,242,.1)}
.brand .mk{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#5B7BA6,#1E3A66 55%,#13213A);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.35)}
.brand .mk img{width:27px;height:auto;display:block}
.brand b{display:block;font-family:var(--serif);font-size:19px;line-height:1.05;font-weight:600;color:#fff}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7DD3C8;margin-top:4px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px;scrollbar-width:thin;scrollbar-color:rgba(207,227,242,.2) transparent}
.nav .gl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7D97B8;padding:12px 0 5px 50px}
.nav .st{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:6px 10px;border-radius:14px;text-align:left;color:#D3E6F2;transition:background .15s}
.nav .st::before{content:"";position:absolute;left:23px;top:-12px;bottom:-12px;width:2px;background:rgba(207,227,242,.13);pointer-events:none}
.nav .st:first-of-type::before{top:50%}.nav .st:last-of-type::before{bottom:50%}
.nav .st.set .n{background:transparent;border-style:dashed}.nav .st.set.on .n{background:#CFE3F2;border-style:solid}.nav .st.set .tx b .ic{display:none}
.nav .st .n{position:relative;z-index:1;width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#CFE3F2;background:#13213A;border:1.5px solid rgba(207,227,242,.32);transition:all .2s}
.nav .st .n .ic{width:14px;height:14px;stroke-width:3}
.nav .st .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.nav .st .tx b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .st .tx b .ic{width:15px;height:15px;opacity:.65}
.nav .st .tx small{font-size:11.5px;color:#A9BED4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.nav .st:hover{background:rgba(207,227,242,.07)}
.nav .st.done .n{background:#1baf7a;border-color:#1baf7a;color:#fff}
.nav .st.on{background:linear-gradient(90deg,rgba(207,227,242,.17),rgba(207,227,242,.05));box-shadow:inset 3px 0 0 #CFE3F2}
.nav .st.on .n{background:#CFE3F2;border-color:#CFE3F2;color:#0B1424;box-shadow:0 0 0 5px rgba(207,227,242,.14),0 0 18px rgba(125,211,200,.6)}
.nav .st.on .tx small{color:#D3E6F2}
.nav .bd{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#7DD3C8;color:#0B1424;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.nav .bd.warn{background:#E9B24C}.nav .bd.bad{background:#F07C8C}
.sbox{margin:0 14px 10px;padding:11px 12px;border-radius:14px;background:rgba(207,227,242,.07);border:1px solid rgba(207,227,242,.12);font-size:13px;color:#CFE3F2}
.sbox b{color:#fff;font-family:var(--serif);font-size:16px}.sbox .sub{color:#A9BED4}
.sbox .btn{background:#CFE3F2;color:#0B1424}
.hbar{display:flex;gap:2px;height:7px;border-radius:7px;overflow:hidden;margin:8px 0 6px;background:rgba(207,227,242,.1)}
.hbar i{display:block;height:100%}
.sfoot{display:flex;gap:6px;padding:10px 14px 16px;border-top:1px solid rgba(207,227,242,.1)}
.sfoot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;border-radius:11px;font-size:12.5px;font-weight:600;color:#D3E6F2;background:rgba(207,227,242,.07)}
.sfoot button:hover,.sfoot button.on{background:rgba(207,227,242,.16);color:#fff}
.sfoot .ic{width:16px;height:16px}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 26px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.top .burger{display:none}
.crumb{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:0}
.crumb .cn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;font-weight:700;font-size:13px;flex:0 0 30px}
.crumb .cn .ic{width:16px;height:16px}
.crumb small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.crumb b{display:none;font-family:var(--serif);font-size:16px;line-height:1.1}
.srch{position:relative;flex:1;max-width:460px;margin:0 auto}
.srch>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch input[type=search]{width:100%;padding:10px 14px 10px 40px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);outline:0}
.srch input[type=search]::placeholder{color:var(--faint)}
.srch input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,102,.14)}
.srch .res{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:420px;overflow:auto;display:none;z-index:60;padding:6px}
.srch .res.open{display:block}
.srch .res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 9px;border-radius:10px}
.srch .res button:hover,.srch .res button.hl{background:var(--card2)}
.srch .res .tb{flex:1;min-width:0}.srch .res b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srch .res small{font-size:11.5px;color:var(--muted)}
.srch .none{padding:10px;font-size:13px;color:var(--muted)}
.qtyp{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.qtyp.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}.qtyp.low{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.qtyp.out{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.hacts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.curp{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 8px 0 5px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s;flex:0 0 auto}
.curp:hover{background:var(--card2)}.curp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,102,.14)}
.curp .cs{min-width:26px;height:26px;padding:0 5px;border-radius:8px;display:grid;place-items:center;background:var(--btn);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.curp .chev{width:14px;height:14px;color:var(--muted)}
.curp select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;font-size:16px}
.bnav{display:none}
.show-sm{display:none}
/* the 1-2-3 guide on every page */
.guide{margin-bottom:18px;padding:14px 16px 16px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(115deg,color-mix(in srgb,var(--lav) 30%,var(--card)),var(--card) 70%)}
html[data-theme="dark"] .guide{background:linear-gradient(115deg,#1F2F49,var(--card) 70%)}
.guide .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.guide .gk{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.guide .gk .ic{width:16px;height:16px}
.gs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gs3>div{position:relative;padding:12px 34px 12px 54px;border-radius:14px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow2)}
.gs3>div:not(:last-child)::after{content:"";position:absolute;right:-11px;top:50%;width:8px;height:8px;border-top:2px solid var(--lav);border-right:2px solid var(--lav);transform:translateY(-50%) rotate(45deg);z-index:1}
.gs3 .gn{position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;font-weight:700;font-size:13px}
.gs3 .gi{position:absolute;right:10px;top:11px;color:var(--accent);opacity:.55}
.gs3 .gi .ic{width:18px;height:18px}
.gs3 b{display:block;font-size:13.5px;line-height:1.3}
.gs3 small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.view{position:relative;padding:22px 26px 80px;max-width:1320px;width:100%;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:30px;line-height:1.1;margin-top:3px}
.phead p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:720px}
.phead .pa{display:flex;gap:8px;flex-wrap:wrap}
.next{display:flex;align-items:center;gap:12px;margin-top:28px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);flex-wrap:wrap}
.next .nn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;font-size:11.5px;font-weight:700}
.next>span:first-child{display:flex;align-items:center;gap:7px}

/* ================= generic ================= */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow2);min-width:0;position:relative}
.card h3,.ch h3{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .ic{color:var(--accent)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.kick{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:12px;background:var(--btn);color:var(--onbtn);font-weight:600;font-size:13.5px;border:1px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--btn2);box-shadow:0 6px 16px rgba(30,58,102,.3)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card2);box-shadow:none}
.btn.soft{background:var(--card2);color:var(--ink);border-color:var(--line)}
.btn.soft:hover{background:var(--card3);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ic{width:16px;height:16px}
label.btn{cursor:pointer}
.icb{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink2);flex:0 0 36px;transition:background .15s,transform .1s}
.icb:hover{background:var(--card2)}.icb:active{transform:scale(.95)}.icb:disabled{opacity:.35;pointer-events:none}
.icb.sm{width:30px;height:30px;flex:0 0 30px;border-radius:9px}.icb.sm .ic{width:15px;height:15px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink2);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip b{font-weight:700;opacity:.8}
.chip .ic{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--card3);color:var(--ink2);white-space:nowrap}
.pill .ic{width:13px;height:13px}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warnp{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.kind{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pill.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.st.ok{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.pill.st.low{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.st.out{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.goodt{color:var(--good)}.badt{color:var(--bad)}.warnt{color:var(--warn)}
.goodt .ic,.badt .ic{display:inline-block;vertical-align:-3px;width:16px;height:16px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);outline:0;transition:border-color .15s,box-shadow .15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,102,.14)}
input[readonly]{opacity:.7}
textarea{resize:vertical;min-height:70px;line-height:1.5}
select{max-width:100%}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld{margin-bottom:12px;min-width:0}
input[type=checkbox]{accent-color:var(--violet);width:17px;height:17px;flex:0 0 17px}
.cur{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 10px;transition:border-color .15s,box-shadow .15s;min-width:0}
.cur:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,102,.14)}
.cur span{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.cur input{border:0!important;background:transparent!important;box-shadow:none!important;padding:10px 6px!important;min-width:0}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .eic{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,#5B7BA6,#1E3A66 55%,#0B1424);box-shadow:0 12px 24px rgba(30,58,102,.3)}
.empty .eic .ic{width:30px;height:30px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:4px}
.empty>div{max-width:520px;margin:0 auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:0}.kv.tot{border-top:2px solid var(--line);margin-top:4px;padding-top:10px}
.tip{font-size:12.5px;color:var(--muted);background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.tip .ic{color:var(--accent);margin-top:1px}
.note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;border-radius:12px;padding:9px 11px;background:var(--card2);border:1px solid var(--line)}
.note.warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note .ic{color:var(--warn);margin-top:1px}
.okmsg{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--good) 9%,var(--card));color:var(--ink2);font-size:13.5px}
.okmsg .ic{color:var(--good);width:20px;height:20px}
.okmsg.big{padding:18px}
.hr{height:1px;background:var(--line2);margin:14px 0}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb{margin-bottom:16px}
.bar{height:7px;border-radius:7px;background:var(--card3);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--violet),var(--lav));transition:width .6s}
.kb{font:600 11px var(--sans);padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--card2)}
.list{display:flex;flex-direction:column;gap:7px}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:15px;width:max-content;max-width:100%}
.subs button{padding:8px 15px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.subs button:hover{color:var(--ink);background:var(--card2)}
.subs button.on{background:var(--btn);color:#fff;box-shadow:0 4px 12px rgba(30,58,102,.3)}
.subs .bd{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:10px;background:rgba(255,255,255,.2)}
.subs button:not(.on) .bd{background:var(--card3);color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{padding:7px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.seg button .ic{width:15px;height:15px}
.seg button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools select{width:auto;min-width:150px;padding:8px 10px}
.srch2{position:relative;flex:1 1 260px;max-width:380px}
.srch2 .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch2 input[type=search]{padding:9px 12px 9px 36px;background:var(--card)}
.vt{display:flex;padding:3px;border-radius:11px;background:var(--card);border:1px solid var(--line)}
.vt button{width:32px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.vt button.on{background:var(--btn);color:#fff}
.vt .ic{width:16px;height:16px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}
.sumbar span{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:8px 14px;display:flex;flex-direction:column;min-width:120px}
.sumbar small{font-size:11px;color:var(--muted)}.sumbar b{font-family:var(--serif);font-size:19px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--lav) 40%,var(--card)),var(--card));border:1px solid var(--line);font-size:13px}
.banner>.ic{color:var(--accent);width:22px;height:22px}.banner>span{flex:1}

/* thumbnails */
.th{display:grid;place-items:center;flex:0 0 auto;border-radius:30%;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c));box-shadow:0 4px 10px color-mix(in srgb,var(--c) 30%,transparent);overflow:hidden}
.th .ic{width:55%;height:55%}
.th.ph{background:#fff;box-shadow:0 0 0 1px var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}

/* ================= dashboard ================= */
.sphere{position:relative;border-radius:var(--r);overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(125,211,200,.35),transparent 65%),linear-gradient(165deg,#FFFFFF,#E8F0F8);border:1px solid var(--line);box-shadow:var(--shadow);min-height:420px}
html[data-theme="dark"] .sphere{background:radial-gradient(circle at 50% 40%,rgba(30,58,102,.45),transparent 65%),linear-gradient(165deg,#172338,#0B1424)}
.sphere canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.sphere canvas:active{cursor:grabbing}
.sphere .ov{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.sphere .ov h3{font-size:20px}

.hero{padding:26px}

.flow>div{position:relative;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);display:flex;flex-direction:column;gap:3px}

/* ================= item cards & tables ================= */
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}

.icard.out{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.icard.low{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.ihead{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-width:0}
.ihead .tb{flex:1;min-width:0}.ihead b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ihead small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.qrow .big{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}.qrow .u{font-size:12px;color:var(--muted);margin-left:6px}

.facts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.facts3 small{font-size:10.5px;color:var(--muted)}.facts3 b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iacts{display:flex;align-items:center;gap:6px}
.iacts .loc{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}.iacts .loc .ic{width:13px;height:13px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.facts span{background:var(--card2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.facts small{font-size:10.5px;color:var(--muted)}
.q{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--card3);color:var(--muted);font-size:9px;font-style:normal;font-weight:700;vertical-align:1px;cursor:help}
[data-tip]{cursor:help}button[data-tip],.chart [data-tip]{cursor:pointer}.facts b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{width:100%;border-collapse:collapse;font-size:13px}

.tlink{display:flex;align-items:center;gap:8px;text-align:left;font-weight:600;color:var(--ink);max-width:340px}

/* ================= lots, refunds, Etsy ================= */

/* ================= modals: lines, previews ================= */
.mdl{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(11,20,36,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}

.preview:empty{display:none}
.lines{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.lh,.line{display:grid;grid-template-columns:minmax(0,1fr) 80px 130px 90px 30px;gap:8px;align-items:center}
.lh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

.sumup .pf{background:color-mix(in srgb,var(--good) 13%,var(--card));}.sumup .pf b{font-family:var(--serif);font-size:19px;color:var(--good)}.sumup .pf span{font-size:11px;color:var(--muted)}
.sumup .pf.neg{background:color-mix(in srgb,var(--bad) 12%,var(--card))}.sumup .pf.neg b{color:var(--bad)}
.ipanel .bcwrap{max-width:320px;padding:8px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.bc{display:block;max-width:100%}
.bcw{display:flex;flex-direction:column;align-items:center;width:100%;background:#fff}.bcw small{font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#000;letter-spacing:.04em;margin-top:2px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover}
.cam i{position:absolute;left:12%;right:12%;top:45%;height:2px;background:#F07C8C;box-shadow:0 0 12px #F07C8C}
.lpick{display:flex;flex-direction:column;gap:4px;max-height:330px;overflow:auto;border:1px solid var(--line2);border-radius:12px;padding:6px}
.lpick label{gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}.lpick label:hover{background:var(--card2)}
.lpick .tb{flex:1;min-width:0;font-size:13.5px;font-weight:500}.lpick small{display:block;color:var(--muted);font-size:11.5px}
.welcome .wl{width:92px;height:92px;border-radius:24px;margin:2px auto 14px;display:block;box-shadow:0 12px 28px rgba(11,20,36,.3)}

/* ================= recipes ================= */
.rgrid{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}

.rpick .tb{flex:1;min-width:0}.rpick b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rpick small{display:block;font-size:11.5px;color:var(--muted)}
.bom{display:flex;flex-direction:column;gap:8px}

.brow2 .cur span{font-weight:500;font-size:12px}
.cost .bigv{font-size:28px}

/* ================= stock count ================= */
.cbar{position:sticky;top:72px;z-index:5}

.scanbox{max-width:520px}

/* ================= pricing ================= */
.pbreak{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.pbreak div{background:var(--card2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column}

.cmpb{display:flex;align-items:center;gap:16px;margin-top:12px}.cmpb>div{display:flex;flex-direction:column}.cmpb small{font-size:12px;color:var(--muted)}.cmpb b{font-family:var(--serif);font-size:32px;line-height:1.1}.cmpb>.ic{color:var(--muted);width:26px;height:26px}
.cutres .btn{align-self:flex-start}
.cs2{font-weight:700;color:var(--muted);font-size:18px}
.catb{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.cbrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card2)}
.cbrow .ci .ic{width:20px;height:20px}.cbrow .tb{flex:1;min-width:0;display:flex;flex-direction:column}.cbrow .tb small{font-size:11.5px;color:var(--muted)}.cbrow .bar{margin-top:4px;height:5px}
.cbrow input{width:92px;padding:7px 9px}
/* family */
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mcard::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);border-radius:var(--r) var(--r) 0 0}
.mcard .tb{display:flex;flex-direction:column;min-width:0}
.owe{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:var(--card2);font-size:13.5px}
/* settings */
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.rt{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:12px;background:var(--card2);border:1px solid var(--line2)}
.rt.used{border-color:var(--teal)}
.rt span{flex:1;display:flex;flex-direction:column;min-width:0}.rt small{font-size:11px;color:var(--muted)}
.rt input{width:100px;padding:7px 9px}
.pmcard{position:relative;border-radius:16px;padding:16px;min-height:120px;color:#fff;display:flex;flex-direction:column;gap:2px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,#fff 15%),var(--c) 50%,color-mix(in srgb,var(--c) 70%,#000));box-shadow:0 10px 24px color-mix(in srgb,var(--c) 35%,transparent);overflow:hidden}
.pmcard::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.pmcard>span .ic{width:26px;height:26px}.pmcard b{font-size:17px;margin-top:auto}.pmcard i{font-style:normal;letter-spacing:.14em;font-size:13px;opacity:.9}.pmcard small{position:absolute;right:16px;bottom:14px;font-weight:600;opacity:.9}
.tbl tr.tot td{background:var(--card2);border-top:2px solid var(--line)}
.wsteps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}
.wsteps span{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:11px;background:var(--card2);border:1px solid var(--line2);font-size:12.5px;font-weight:600}
.wsteps i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-size:10.5px}
.srch .res button[data-new] .ic{color:var(--accent);width:16px;height:16px}
@media (max-width:980px){.kv4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cd{min-height:58px;padding:3px}.cd .ev{font-size:0;padding:0;width:8px;height:8px;border-radius:50%;background:var(--c)}.cd .ev i,.cd .ev .ic{display:none}.cd .ev.tr{background:var(--coral)}.cd .dt{font-size:9px}.cd{flex-direction:row;flex-wrap:wrap;align-content:flex-start}.cd .dn{width:100%}.jarc{flex-direction:column;text-align:center}.jarc .row{justify-content:center}.catg{grid-template-columns:1fr 1fr}.cmpb b{font-size:24px}.catb{grid-template-columns:1fr}}
@media print{.pdoc table{width:100%;border-collapse:collapse;font-size:11px}.pdoc th,.pdoc td{border-bottom:1px solid #ccc;padding:5px;text-align:left}.pdoc h1{font-size:22px}}
/* =====================================================================
   "Lilac Calm" — clean, airy, easy to read.
   Lilac #A47FB3 (brand) · deep lilac #7A5690 (actions) · ink #1D1722 · white
   One font family, soft surfaces, lots of space, colour only where it means something.
   ===================================================================== */
:root{
  --lilac:#A47FB3;--lilac-d:#7A5690;--lilac-l:#F1EAF5;--lilac-m:#E4D6EC;
  --mid:#1D1722;--violet:#7A5690;--lav:#A47FB3;--pale:#F1EAF5;
  --bg:#F8F6FA;--bg2:#F1EDF4;--panel:#FFFFFF;--card:#FFFFFF;--card2:#F8F5FA;--card3:#EFE8F3;
  --line:#E9E2EE;--line2:#F1ECF4;
  --ink:#1D1722;--ink2:#3B3342;--muted:#77707E;--faint:#A59DAD;
  --accent:#7A5690;--accent2:#5F4073;--btn:#7A5690;--btn2:#694880;--onbtn:#fff;
  --good:#2E8B62;--warn:#B07A12;--bad:#C2455C;--coral:#C2557A;--teal:#7A5690;
  --shadow:0 20px 50px rgba(45,25,60,.12);--shadow2:0 1px 2px rgba(45,25,60,.04),0 4px 14px rgba(45,25,60,.04);
  --serif:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r:16px;--r2:12px;
}
html[data-theme="dark"]{
  --bg:#141118;--bg2:#1A161F;--panel:#1E1924;--card:#1E1924;--card2:#252030;--card3:#2F2839;
  --line:#2F2838;--line2:#262030;
  --ink:#F3EFF6;--ink2:#DCD3E3;--muted:#A79DB0;--faint:#7D7486;
  --accent:#C7A6D8;--accent2:#E2CFEC;--btn:#A47FB3;--btn2:#B791C6;--onbtn:#fff;
  --lilac-l:#2A2232;--lilac-m:#3A2F45;
  --good:#5CC48D;--warn:#E0B15A;--bad:#EF7F92;--coral:#EE8CAB;
  --shadow:0 20px 50px rgba(0,0,0,.5);--shadow2:0 1px 2px rgba(0,0,0,.3);
}
body{font-family:var(--sans);font-size:14.5px;background:var(--bg);color:var(--ink)}
body::before,body::after{display:none}
h1,h2,h3,.serif{font-family:var(--sans);font-weight:700;letter-spacing:-.02em}
h3{font-size:15px;display:flex;align-items:center;gap:8px}
h3 .ic{color:var(--lilac-d);width:17px;height:17px}
html[data-theme="dark"] h3 .ic{color:var(--accent)}
::selection{background:var(--lilac-m)}

/* ---------- sidebar: white, quiet, one clear "you are here" ---------- */
.side{background:var(--panel);color:var(--ink);box-shadow:none;border-right:1px solid var(--line);width:256px;flex-basis:256px}
.side::after{display:none}
.brand{border-bottom:1px solid var(--line2);padding:20px 18px 16px}
.brand .mk{background:var(--lilac);box-shadow:none;border-radius:12px;width:38px;height:38px;flex-basis:38px}
.brand b{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.02em;text-transform:none;font-weight:500}
.nav{padding:8px 12px}
.nav .gl{color:var(--faint);font-size:10.5px;letter-spacing:.12em;padding:14px 10px 6px}
.nav .st{padding:8px 10px;border-radius:10px;gap:10px;color:var(--ink2);border:0}
.nav .st::before{display:none}
.nav .st .n{width:22px;height:22px;flex:0 0 22px;font-size:11px;background:var(--card3);color:var(--muted);border:0}
.nav .st .n .ic{width:12px;height:12px}
.nav .st .tx b{color:var(--ink2);font-weight:600;font-size:13.5px}
.nav .st .tx b .ic{display:none}
.nav .st .tx small{display:none!important}
.nav .st:hover{background:var(--card2)}
.nav .st.done .n{background:var(--lilac-m);color:var(--lilac-d)}
.nav .st.on{background:var(--lilac-l);box-shadow:none}
.nav .st.on .n{background:var(--lilac-d);color:#fff;box-shadow:none}
.nav .st.on .tx b{color:var(--lilac-d)}
html[data-theme="dark"] .nav .st.on .tx b{color:var(--accent)}
.nav .st.set .n{background:var(--card3);border:0}.nav .st.set.on .n{background:var(--lilac-d)}
.nav .bd{background:var(--card3);color:var(--ink2);font-size:10.5px;min-width:19px;height:19px}
.nav .bd.warn{background:#F6E7C8;color:#7A5300}.nav .bd.bad{background:#F7D9DF;color:#A2283F}
html[data-theme="dark"] .nav .bd.warn{background:#4A3A1A;color:#F0C978}html[data-theme="dark"] .nav .bd.bad{background:#4A2229;color:#F5A3B1}
.navx{border-top:1px solid var(--line2)}
.sbox{background:var(--lilac-l);border:0;color:var(--ink);box-shadow:none;border-radius:14px}
.sbox b{font-family:var(--sans);font-weight:700;font-size:15px;color:var(--ink)}.sbox .sub{color:var(--muted)}
.sbox .btn{background:var(--btn);color:#fff}
.sfoot{border-top:1px solid var(--line2)}
.sfoot button{color:var(--muted);background:transparent;border:0}
.sfoot button:hover{background:var(--card2);color:var(--ink)}
@media (max-height:1020px){.nav .st .tx small{display:none}}

/* ---------- top bar ---------- */
.top{background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid transparent;padding:14px 32px}
.crumb{display:none}
.srch{margin:0;max-width:420px}
.srch input[type=search]{border-radius:12px;border:1px solid var(--line);background:var(--card)}
.icb,.curp{border:1px solid var(--line);background:var(--card);box-shadow:none}
.curp .cs{background:var(--lilac-l);color:var(--lilac-d)}
html[data-theme="dark"] .curp .cs{color:var(--accent)}
.bell .bn{background:var(--bad);color:#fff;border-color:var(--bg)}

/* ---------- page header: one title, one line ---------- */
.view{padding:10px 32px 80px;max-width:1240px}
.phead{margin-bottom:22px;align-items:center}
.phead h1{font-size:28px;line-height:1.15;letter-spacing:-.025em;text-transform:none}
.phead .scr{display:block;font-size:12px;font-weight:600;color:var(--lilac-d);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
html[data-theme="dark"] .phead .scr{color:var(--accent)}
.phead p{font-size:14px;color:var(--muted);margin-top:4px}

/* ---------- buttons ---------- */
.btn{border-radius:11px;font-weight:600;border:1px solid transparent;box-shadow:none;padding:10px 16px}
.btn:hover{background:var(--btn2);box-shadow:0 6px 16px rgba(122,86,144,.25);color:#fff}
.btn.soft,.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.soft:hover,.btn.ghost:hover{background:var(--card2);color:var(--ink);box-shadow:none;border-color:var(--lilac-m)}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad)}

/* ---------- surfaces ---------- */
.card,.scard,.tcard,.icard,.sphere,.guide{border:1px solid var(--line);box-shadow:var(--shadow2);border-radius:var(--r)}
.card{padding:20px}
.grid{gap:18px}
.mt{margin-top:18px}
.scard::before,.tcard::before,.mcard::before{display:none}
.scard:hover,.tcard:hover,.stat:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(45,25,60,.08);border-color:var(--lilac-m)}
.stat{padding:16px 18px}
.stat .si{background:var(--lilac-l);color:var(--lilac-d);border:0;width:40px;height:40px;flex-basis:40px;border-radius:12px}
html[data-theme="dark"] .stat .si{color:var(--accent)}
.stat .v,.bigv,.sprice .big,.sumbar b,.cmpb b,.kvb b{font-family:var(--sans);font-weight:700;letter-spacing:-.03em}
.stat .v{font-size:22px}.bigv{font-size:38px;line-height:1.05}.sprice .big{font-size:22px}
.kick{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:none;color:var(--muted)}
.sumbar{gap:12px}
.sumbar span{border:1px solid var(--line);border-radius:14px;box-shadow:none;padding:12px 16px;min-width:140px}
.sumbar small{font-size:12px}.sumbar b{font-size:19px}
.kvb b{font-size:16px}
.guide{background:var(--card);margin-bottom:22px}
.guide .gk{color:var(--lilac-d)}
.gs3>div{border:0;background:var(--card2);box-shadow:none}
.gs3 .gn,.next .nn,.wsteps i{background:var(--lilac-d);color:#fff}
.gs3 .gi{display:none}
.gs3>div:not(:last-child)::after{display:none}
.next{border:1px dashed var(--line);background:transparent}
.subs{border:1px solid var(--line);box-shadow:none;background:var(--card)}
.subs button.on,.seg button.on,.chip.on{background:var(--lilac-d);border-color:var(--lilac-d);color:#fff;box-shadow:none}
.seg button,.chip{border:1px solid var(--line);background:var(--card)}
.chip:hover,.seg button:hover{border-color:var(--lilac)}
.bar{background:var(--card3);border:0;height:6px}.bar i{background:var(--lilac)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:11px}
input:focus,select:focus,textarea:focus{border-color:var(--lilac);box-shadow:0 0 0 3px color-mix(in srgb,var(--lilac) 22%,transparent)}
input[type=checkbox]{accent-color:var(--lilac-d)}
.banner{border:1px solid var(--lilac-m);background:var(--lilac-l);box-shadow:none}
.banner>.ic{color:var(--lilac-d)}
.okmsg{background:var(--card2);border:0;color:var(--muted)}
.okmsg .ic{color:var(--good)}
.empty .eic{background:var(--lilac-l);color:var(--lilac-d);border:0;box-shadow:none}
.empty b{font-family:var(--sans);font-weight:700;font-size:18px}
.crow2,.alrow{background:transparent;border:0;border-radius:12px;padding:10px 8px}
.list .crow2+.crow2,.list .alrow+.alrow{border-top:1px solid var(--line2);border-radius:0}
button.crow2:hover,.alrow:hover{background:var(--card2);border-radius:12px}
.alrow.warn,.alrow.bad{background:transparent;border-color:transparent}
.alrow.bad .tb b{color:var(--bad)}.alrow.warn .tb b{color:var(--warn)}
.cat{background:var(--card);border:1px solid var(--line)}
.cat:hover{border-color:var(--lilac);background:var(--lilac-l);transform:none}
.lo{box-shadow:none;border-radius:30%}
.tbl th{border-bottom:1px solid var(--line);font-family:var(--sans)}
.tblwrap{border:1px solid var(--line)}
.pill{border-radius:999px;font-weight:600}
.verd{border:0}

/* ---------- modal ---------- */
.mdl{background:rgba(29,23,34,.35)}
.mdl .box{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:24px}
.mdl .mh h2{font-size:20px;text-transform:none;letter-spacing:-.02em}
.mdl .mi{background:var(--lilac-l);color:var(--lilac-d);border:0}
html[data-theme="dark"] .mdl .mi{color:var(--accent)}
details.more{border:1px solid var(--line);background:var(--card2)}
.welcome h2{font-size:26px;text-transform:none}
.welcome .wl{box-shadow:0 10px 26px rgba(122,86,144,.3);border:0}
.welcome .scr{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac-d);margin-bottom:4px}
.wsteps{display:none}

/* ---------- orbit ---------- */
.sphere.orbit{background:radial-gradient(circle at 50% 58%,#fff 0,transparent 55%),linear-gradient(170deg,#F4EDF8,#E6D8EE)}
html[data-theme="dark"] .sphere.orbit{background:radial-gradient(circle at 50% 58%,rgba(164,127,179,.18),transparent 55%),linear-gradient(170deg,#211B28,#17131C)}
.sphere.orbit .ov h3{font-size:15px;color:var(--ink)}
.sphere.orbit .ov .sub{font-size:12.5px;color:var(--muted)}
.sphere .lg{font-size:11.5px}.sphere .lg i{border:0;border-radius:50%}

/* ---------- page bits ---------- */
.valc{background:var(--card)}
.hero2{display:flex;flex-direction:column;gap:14px}
.hero2 .big{font-size:42px;font-weight:700;letter-spacing:-.035em;line-height:1}
.hero2 .big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.hero2 .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero2 .three span{background:var(--card2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.hero2 .three small{font-size:11.5px;color:var(--muted)}.hero2 .three b{font-size:16px}
.jarc{background:var(--card)}
.cd{background:var(--card);border:1px solid var(--line2)}
.cd.today{border:1.5px solid var(--lilac-d);box-shadow:none}
.pmcard{border:0;box-shadow:0 10px 24px rgba(45,25,60,.15)}
.frow{background:var(--card);border:1px solid var(--line)}
.frow.on{border-color:var(--lilac);background:var(--lilac-l)}
.rt{background:var(--card)}.rt.used{border-color:var(--lilac)}
.stars .on{color:#E2A21A}
.bnav{border-top:1px solid var(--line)}
.bnav .pri span{background:var(--btn);box-shadow:0 6px 16px rgba(122,86,144,.35)}
.toast{border:0}
/* simple subscription card */
.scard{padding:16px;gap:12px}
.scard .row1{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.scard .row1 .tb{flex:1;min-width:0;display:flex;flex-direction:column}
.scard .row1 b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .row1 small{font-size:12.5px;color:var(--muted)}
.scard .pr{text-align:right;display:flex;flex-direction:column}
.scard .pr b{font-size:17px;letter-spacing:-.02em}.scard .pr small{font-size:11.5px;color:var(--muted)}
.scard .row2{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--muted)}
.scard .row2 b{color:var(--ink);font-weight:600}
.scard .row2 .sp{flex:1}
.icards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media (max-width:980px){.side{width:280px}}
@media (max-width:640px){.view{padding:6px 16px 90px}.top{padding:10px 16px}.phead h1{font-size:24px}.hero2 .big{font-size:34px}}
.bnav .pri span{background:linear-gradient(145deg,#B791C6,#7A5690)!important}
.bnav button.on{color:var(--lilac-d);background:var(--lilac-l)}
@media (max-width:640px){.phead .pa{width:100%}.phead .pa [data-a=guideOn]{flex:0 0 auto!important;width:auto}.sumbar span{min-width:0}}

/* ---------- dashboard hero: big 3D orbit ---------- */
.orbhero{position:relative;min-height:540px;border-radius:26px;overflow:hidden;color:#fff;
 background:radial-gradient(700px 420px at 68% 52%,rgba(201,169,214,.38),transparent 62%),radial-gradient(500px 300px at 10% 0%,rgba(164,127,179,.45),transparent 70%),linear-gradient(135deg,#2A1B36 0%,#4A2F5E 45%,#7A5690 100%);
 box-shadow:0 24px 60px rgba(74,47,94,.35)}
.orbhero canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.orbhero canvas:active{cursor:grabbing}
.orbhero .ohl{position:absolute;left:34px;top:34px;bottom:34px;width:min(330px,40%);display:flex;flex-direction:column;gap:14px;pointer-events:none;z-index:2}
.orbhero .ohl>*{pointer-events:auto}
.orbhero .ok2{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:12.5px;font-weight:600;backdrop-filter:blur(8px)}
.orbhero .ok2 .ic{width:15px;height:15px}
.orbhero .ohl>small{font-size:13px;color:rgba(255,255,255,.75);margin-bottom:-12px}
.orbhero .obig{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
.ochips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ochips span,.obud,.onext{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ochips span{padding:10px 12px;display:flex;flex-direction:column}.ochips small{font-size:11.5px;color:rgba(255,255,255,.7)}.ochips b{font-size:16px}
.obud{padding:11px 13px;font-size:12.5px}.obud span{color:rgba(255,255,255,.75)}
.obar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}.obar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#E4D6EC,#fff)}
.onext{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-top:auto}
